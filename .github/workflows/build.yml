name: Build Xbox 360 app
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with libxenon Docker image
        run: |
          docker run --rm -v "$PWD":/app -w /app free60/libxenon:latest bash -lc '
            export DEVKITXENON=${DEVKITXENON:-/usr/local/xenon}
            echo "DEVKITXENON=$DEVKITXENON"
            which xenon-gcc || true
            ls "$DEVKITXENON" || true
            make
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linklist
          path: |
            linklist.elf32
            linklist.elf
